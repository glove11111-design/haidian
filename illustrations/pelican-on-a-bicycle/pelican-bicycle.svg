<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 800"
  role="img"
  aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只白色鹈鹕骑着复古自行车沿海岸前进：翅膀扶着车把，蹼足踩着踏板，喉囊里还藏着一条小鱼。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BA8D1"/>
      <stop offset="42%" stop-color="#B9DCEB"/>
      <stop offset="68%" stop-color="#F7E3C2"/>
      <stop offset="100%" stop-color="#E8C992"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EB8C9"/>
      <stop offset="100%" stop-color="#4E8FA8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFD7A8"/>
      <stop offset="100%" stop-color="#D7B57A"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E2B8"/>
      <stop offset="100%" stop-color="#D9C08A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F6C14B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6C14B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyLight" x1="0.18" y1="0" x2="0.86" y2="1">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="58%" stop-color="#F3E8D2"/>
      <stop offset="100%" stop-color="#E1CFAF"/>
    </linearGradient>
    <linearGradient id="wingLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9EE"/>
      <stop offset="70%" stop-color="#E7D8BE"/>
      <stop offset="100%" stop-color="#C9B494"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F6B14A"/>
      <stop offset="45%" stop-color="#E07A32"/>
      <stop offset="100%" stop-color="#C45222"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#F7C45A"/>
      <stop offset="100%" stop-color="#E3942C"/>
    </linearGradient>
    <linearGradient id="framePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6F6B"/>
      <stop offset="100%" stop-color="#0E4442"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C47A48"/>
      <stop offset="100%" stop-color="#8A4A2A"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3C14A"/>
      <stop offset="100%" stop-color="#D98928"/>
    </linearGradient>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#5A4630" flood-opacity="0.16"/>
    </filter>
    <style>
      .cloud { animation: drift 22s linear infinite; }
      .cloud-b { animation-duration: 30s; animation-delay: -8s; }
      .bob { animation: bob 2.4s ease-in-out infinite; }
      .pouch-sway { animation: sway 2.8s ease-in-out infinite; transform-origin: 820px 210px; }
      .spin-rear, .spin-front { animation: spin 2.2s linear infinite; }
      .blink { animation: blink 5.5s ease-in-out infinite; transform-origin: 8px -4px; }
      .grass { animation: breeze 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .grass-b { animation-delay: -1.1s; }
      .fish { animation: wiggle 1.6s ease-in-out infinite; transform-origin: 868px 268px; }
      @keyframes drift {
        from { transform: translateX(0); }
        to { transform: translateX(-160px); }
      }
      @keyframes bob {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(1px, -4px) rotate(-0.6deg); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2.4deg); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.08); }
      }
      @keyframes breeze {
        0%, 100% { transform: skewX(0deg); }
        50% { transform: skewX(-6deg); }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-12deg); }
      }
    </style>
  </defs>


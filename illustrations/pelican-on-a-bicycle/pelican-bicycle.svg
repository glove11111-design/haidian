<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 800"
  role="img"
  aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只白色鹈鹕骑着复古自行车沿海岸前进：翅膀扶着车把，蹼足踩着踏板，喉囊里还藏着一条小鱼。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BA8D1"/>
      <stop offset="42%" stop-color="#B9DCEB"/>
      <stop offset="68%" stop-color="#F7E3C2"/>
      <stop offset="100%" stop-color="#E8C992"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EB8C9"/>
      <stop offset="100%" stop-color="#4E8FA8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFD7A8"/>
      <stop offset="100%" stop-color="#D7B57A"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E2B8"/>
      <stop offset="100%" stop-color="#D9C08A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F6C14B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6C14B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyLight" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFdf6"/>
      <stop offset="55%" stop-color="#F4EBD8"/>
      <stop offset="100%" stop-color="#E4D3B4"/>
    </linearGradient>
    <linearGradient id="wingLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9EE"/>
      <stop offset="70%" stop-color="#E7D8BE"/>
      <stop offset="100%" stop-color="#C9B494"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F6B14A"/>
      <stop offset="45%" stop-color="#E07A32"/>
      <stop offset="100%" stop-color="#C45222"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#F7C45A"/>
      <stop offset="100%" stop-color="#E3942C"/>
    </linearGradient>
    <linearGradient id="framePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6F6B"/>
      <stop offset="100%" stop-color="#0E4442"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C47A48"/>
      <stop offset="100%" stop-color="#8A4A2A"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3C14A"/>
      <stop offset="100%" stop-color="#D98928"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5A4630" flood-opacity="0.18"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#5A4630" flood-opacity="0.16"/>
    </filter>
    <style>
      .cloud { animation: drift 22s linear infinite; }
      .cloud-b { animation-duration: 30s; animation-delay: -8s; }
      .bob { animation: bob 2.4s ease-in-out infinite; }
      .pouch-sway { animation: sway 2.8s ease-in-out infinite; transform-origin: 820px 210px; }
      .spin-rear, .spin-front { animation: spin 2.2s linear infinite; }
      .blink { animation: blink 5.5s ease-in-out infinite; }
      .grass { animation: breeze 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .grass-b { animation-delay: -1.1s; }
      .fish { animation: wiggle 1.6s ease-in-out infinite; transform-origin: 868px 268px; }
      @keyframes drift {
        from { transform: translateX(0); }
        to { transform: translateX(-160px); }
      }
      @keyframes bob {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(1px, -4px) rotate(-0.6deg); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2.4deg); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.08); }
      }
      @keyframes breeze {
        0%, 100% { transform: skewX(0deg); }
        50% { transform: skewX(-6deg); }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-12deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="980" cy="148" r="120" fill="url(#sunGlow)"/>
  <circle cx="980" cy="148" r="46" fill="#FFE7A3"/>
  <circle cx="968" cy="136" r="14" fill="#FFF6D4" opacity="0.7"/>

  <!-- Distant land & sea -->
  <path d="M0 428 C 140 408 220 418 340 402 C 470 384 540 400 680 390 C 830 378 940 396 1200 382 L 1200 470 L 0 470 Z" fill="#8FB39A" opacity="0.55"/>
  <path d="M0 448 C 180 436 320 456 500 442 C 690 426 860 448 1200 434 L 1200 510 L 0 510 Z" fill="url(#sea)"/>
  <path d="M0 486 C 90 480 170 492 280 484 C 430 474 560 496 720 486 C 900 474 1040 492 1200 482 V 510 H 0 Z" fill="#6AA3B8" opacity="0.35"/>

  <!-- Beach and path -->
  <path d="M0 508 C 240 494 480 524 760 508 C 980 496 1100 518 1200 510 V 800 H 0 Z" fill="url(#sand)"/>
  <path d="M-20 590 C 180 548 360 562 540 578 C 760 598 980 552 1220 586 L 1220 720 C 980 688 760 736 540 710 C 320 684 140 708 -20 700 Z" fill="url(#path)"/>
  <path d="M-20 628 C 200 598 420 622 640 636 C 880 652 1060 612 1220 640" fill="none" stroke="#E8D19A" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- Clouds -->
  <g class="cloud" fill="#F7FBFF" opacity="0.88">
    <g transform="translate(80,92)">
      <ellipse cx="70" cy="28" rx="70" ry="22"/>
      <ellipse cx="30" cy="22" rx="28" ry="18"/>
      <ellipse cx="92" cy="16" rx="34" ry="20"/>
    </g>
  </g>
  <g class="cloud cloud-b" fill="#F7FBFF" opacity="0.72">
    <g transform="translate(430,58)">
      <ellipse cx="80" cy="24" rx="80" ry="18"/>
      <ellipse cx="40" cy="18" rx="30" ry="16"/>
      <ellipse cx="108" cy="14" rx="36" ry="16"/>
    </g>
  </g>
  <g class="cloud" fill="#F7FBFF" opacity="0.6">
    <g transform="translate(1080,110)">
      <ellipse cx="50" cy="18" rx="50" ry="14"/>
      <ellipse cx="22" cy="14" rx="20" ry="11"/>
    </g>
  </g>

  <!-- Distant gulls -->
  <g fill="none" stroke="#6A7C88" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
    <path d="M160 210 Q 172 198 184 210 Q 196 198 208 210"/>
    <path d="M230 186 Q 240 176 250 186 Q 260 176 270 186"/>
    <path d="M1048 230 Q 1058 220 1068 230 Q 1078 220 1088 230"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="560" cy="668" rx="290" ry="28" fill="#C7A56A" opacity="0.45"/>

  <!-- Scene: bicycle + pelican -->
  <g transform="translate(20,-18)">

    <!-- Rear wheel -->
    <g transform="translate(338,538)">
      <circle r="108" fill="#2A2E33"/>
      <circle r="92" fill="#F2E6C9"/>
      <circle r="84" fill="#3D434A"/>
      <circle r="74" fill="#EEF3F4"/>
      <g class="spin-rear">
        <g stroke="#8A9298" stroke-width="2.2" opacity="0.85">
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="-49.5" y1="-49.5" x2="49.5" y2="49.5"/>
          <line x1="49.5" y1="-49.5" x2="-49.5" y2="49.5"/>
          <line x1="-25" y1="-65.5" x2="25" y2="65.5"/>
          <line x1="25" y1="-65.5" x2="-25" y2="65.5"/>
          <line x1="-65.5" y1="-25" x2="65.5" y2="25"/>
          <line x1="65.5" y1="-25" x2="-65.5" y2="25"/>
        </g>
      </g>
      <circle r="16" fill="#1F6F6B"/>
      <circle r="7" fill="#D9E4E3"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(762,538)">
      <circle r="108" fill="#2A2E33"/>
      <circle r="92" fill="#F2E6C9"/>
      <circle r="84" fill="#3D434A"/>
      <circle r="74" fill="#EEF3F4"/>
      <g class="spin-front">
        <g stroke="#8A9298" stroke-width="2.2" opacity="0.85">
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="-49.5" y1="-49.5" x2="49.5" y2="49.5"/>
          <line x1="49.5" y1="-49.5" x2="-49.5" y2="49.5"/>
          <line x1="-25" y1="-65.5" x2="25" y2="65.5"/>
          <line x1="25" y1="-65.5" x2="-25" y2="65.5"/>
          <line x1="-65.5" y1="-25" x2="65.5" y2="25"/>
          <line x1="65.5" y1="-25" x2="-65.5" y2="25"/>
        </g>
      </g>
      <circle r="16" fill="#1F6F6B"/>
      <circle r="7" fill="#D9E4E3"/>
    </g>

    <!-- Far crank + far foot (behind frame) -->
    <g transform="translate(538,534)">
      <g>
        <line x1="0" y1="0" x2="-46" y2="-28" stroke="#2C3338" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(-46,-28)">
          <rect x="-16" y="-6" width="28" height="12" rx="3" fill="#2C3338"/>
          <!-- far webbed foot attached to far pedal -->
          <g transform="translate(0,2) rotate(-18)">
            <path d="M-6,-4 C -22,10 -18,28 2,32 C 10,20 12,8 8,-2 Z" fill="#D7A33E"/>
            <path d="M-2,-2 L -18,18 M 2,-1 L -4,26 M 6,0 L 10,22" stroke="#C07A24" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Frame -->
    <g fill="none" stroke="url(#framePaint)" stroke-linecap="round" stroke-linejoin="round" filter="url(#tiny)">
      <path d="M538 534 L 455 372" stroke-width="14"/>
      <path d="M538 534 L 698 398" stroke-width="14"/>
      <path d="M468 386 L 690 404" stroke-width="13"/>
      <path d="M538 534 L 338 538" stroke-width="12"/>
      <path d="M455 372 L 338 538" stroke-width="11"/>
      <path d="M698 398 L 762 538" stroke-width="12"/>
      <path d="M698 398 L 698 352" stroke-width="11"/>
    </g>
    <circle cx="538" cy="534" r="18" fill="#0E4442"/>
    <circle cx="538" cy="534" r="11" fill="#D6A441"/>
    <circle cx="538" cy="534" r="5" fill="#F4E2A8"/>

    <!-- Chain -->
    <path d="M520 546 C 430 560 380 556 354 542" fill="none" stroke="#3A4147" stroke-width="4.5" stroke-dasharray="7 5"/>

    <!-- Seat post and saddle -->
    <line x1="455" y1="372" x2="448" y2="348" stroke="#0E4442" stroke-width="10" stroke-linecap="round"/>
    <path d="M410 348 C 430 330 470 328 502 344 C 488 362 450 368 418 360 Z" fill="url(#leather)"/>
    <path d="M422 346 C 440 338 470 338 492 348" fill="none" stroke="#E7B07A" stroke-width="3" opacity="0.7"/>

    <!-- Handlebar -->
    <path d="M698 352 C 720 338 748 336 772 348 C 786 356 790 372 778 384" fill="none" stroke="#0E4442" stroke-width="11" stroke-linecap="round"/>
    <path d="M772 348 C 802 340 818 352 812 372" fill="none" stroke="#0E4442" stroke-width="10" stroke-linecap="round"/>
    <path d="M800 356 C 816 350 828 360 822 376" fill="none" stroke="#8A4A2A" stroke-width="9" stroke-linecap="round"/>
    <circle cx="736" cy="344" r="7" fill="#D6A441"/>
    <!-- bell -->
    <g transform="translate(746,328)">
      <path d="M-10,6 Q 0,-10 10,6 Z" fill="#D6A441"/>
      <circle cy="8" r="3.5" fill="#F4E2A8"/>
    </g>

    <!-- Far wing (behind body) -->
    <g class="bob">
      <path d="M500 292 C 560 250 640 268 710 312 C 732 326 748 340 742 352 C 700 338 640 318 575 328 C 530 334 500 322 500 292 Z" fill="#D9CBB3"/>
      <path d="M620 300 C 660 292 710 318 738 346" fill="none" stroke="#C4B193" stroke-width="4"/>
    </g>

    <!-- Pelican -->
    <g class="bob">
      <!-- Tail -->
      <path d="M392 318 C 340 312 300 338 278 372 C 318 352 360 358 398 368 C 396 344 398 328 392 318 Z" fill="#EFE4CE"/>
      <path d="M300 350 C 318 338 348 340 372 352" fill="none" stroke="#4A5560" stroke-width="7" stroke-linecap="round"/>
      <path d="M308 362 C 328 350 354 352 376 364" fill="none" stroke="#4A5560" stroke-width="6" stroke-linecap="round"/>

      <!-- Body -->
      <path d="M390 332 C 382 262 448 218 530 226 C 610 234 658 278 650 332 C 644 384 590 416 512 422 C 430 428 396 386 390 332 Z" fill="url(#bodyLight)"/>
      <path d="M430 300 C 460 268 540 262 600 292" fill="none" stroke="#FFFDF8" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
      <path d="M470 390 C 520 404 580 392 620 360" fill="none" stroke="#D9C7A6" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

      <!-- Neck -->
      <path d="M575 286 C 602 246 628 206 678 182 C 708 166 748 168 782 186 L 770 222 C 742 206 714 206 692 218 C 650 244 622 278 598 318 Z" fill="url(#bodyLight)"/>
      <path d="M608 270 C 638 232 678 198 728 188" fill="none" stroke="#FFFDF8" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

      <!-- Head -->
      <g transform="translate(776,188) rotate(-8)">
        <ellipse rx="46" ry="36" fill="url(#bodyLight)"/>
        <ellipse cx="-6" cy="-6" rx="18" ry="12" fill="#FFFDF8" opacity="0.65"/>
        <!-- eye -->
        <g class="blink" transform="translate(8,-4)">
          <ellipse rx="11" ry="11" fill="#F6E19A"/>
          <circle r="6.5" fill="#3A2A1A"/>
          <circle cx="-1.5" cy="-1.2" r="4.2" fill="#6A4A28"/>
          <circle cx="-2.2" cy="-2.4" r="1.8" fill="#FFFDF8"/>
        </g>
        <path d="M-2,-18 Q 10,-28 24,-16" fill="none" stroke="#E8D7B8" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Upper bill -->
      <path d="M808 176 C 870 158 940 168 1002 188 C 1014 192 1016 202 1004 208 C 940 192 868 184 812 196 Z" fill="url(#bill)"/>
      <path d="M818 182 C 880 168 948 176 996 194" fill="none" stroke="#FFE08A" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- bill nail -->
      <path d="M988 186 C 1008 184 1018 196 1008 210 C 996 206 988 198 988 186 Z" fill="#C45222"/>

      <!-- Pouch -->
      <g class="pouch-sway">
        <path d="M812 196 C 860 198 930 208 996 214 C 1000 236 972 292 908 322 C 838 354 790 318 786 258 C 784 226 792 204 812 196 Z" fill="url(#pouch)"/>
        <path d="M824 214 C 870 228 920 248 958 246" fill="none" stroke="#F4C078" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
        <path d="M818 236 C 860 268 910 292 956 286" fill="none" stroke="#B8441C" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
        <!-- pouch rim / lower mandible -->
        <path d="M812 196 C 868 204 940 214 996 214" fill="none" stroke="#E3942C" stroke-width="7" stroke-linecap="round"/>
        <!-- little fish -->
        <g class="fish">
          <path d="M848 262 C 862 248 886 250 894 266 C 886 284 862 284 848 274 Z" fill="#6BB3C8"/>
          <path d="M848 268 L 832 256 L 836 270 L 832 282 Z" fill="#4E8FA8"/>
          <circle cx="884" cy="264" r="2.2" fill="#1E3A42"/>
        </g>
      </g>
    </g>

    <!-- Near wing as handlebar arm -->
    <g class="bob">
      <path d="M508 300 C 560 286 640 318 724 348 C 748 358 770 352 778 364 C 770 378 742 374 714 366 C 640 348 570 350 522 368 C 492 348 484 318 508 300 Z" fill="url(#wingLight)"/>
      <!-- primaries gripping the bar -->
      <g transform="translate(742,358) rotate(18)">
        <path d="M0 0 C 18 -8 38 -4 52 8 C 34 10 16 12 0 10 Z" fill="#4A5560"/>
        <path d="M4 8 C 22 2 42 8 56 20 C 38 18 20 18 4 16 Z" fill="#3A434C"/>
        <path d="M6 16 C 24 12 40 20 50 30 C 34 26 18 24 6 24 Z" fill="#2F3840"/>
      </g>
      <path d="M540 318 C 600 312 670 338 730 358" fill="none" stroke="#FFFDF8" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Near leg + pedal (in front) -->
    <path d="M500 400 C 518 448 548 500 590 548" fill="none" stroke="#F4EBD8" stroke-width="22" stroke-linecap="round"/>
    <path d="M500 400 C 518 448 548 500 590 548" fill="none" stroke="#E4D3B4" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(538,534)">
      <g>
        <line x1="0" y1="0" x2="46" y2="28" stroke="#2C3338" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(46,28)">
          <rect x="-12" y="-7" width="30" height="14" rx="3" fill="#2C3338"/>
          <g transform="rotate(16)">
            <path d="M-8,-8 C -28,8 -22,34 6,38 C 18,22 18,6 10,-8 Z" fill="url(#foot)"/>
            <path d="M-2,-4 L -22,18 M 4,-2 L 0,28 M 10,0 L 18,24" stroke="#C07A24" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M-18,14 C -8,26 8,30 18,22" fill="none" stroke="#E7B24A" stroke-width="3" opacity="0.6"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Speed dust -->
  <g fill="#C7A56A" opacity="0.45">
    <circle cx="214" cy="650" r="4"/>
    <circle cx="242" cy="662" r="3"/>
    <circle cx="198" cy="666" r="2.4"/>
    <circle cx="268" cy="648" r="3.2"/>
  </g>
  <g fill="none" stroke="#C7A56A" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <path d="M160 620 L 70 612"/>
    <path d="M150 640 L 48 636"/>
    <path d="M170 656 L 86 662"/>
  </g>

  <!-- Foreground dune grass -->
  <g class="grass" fill="none" stroke="#6F8A4E" stroke-linecap="round">
    <path d="M86 780 C 78 720 96 680 74 640" stroke-width="4"/>
    <path d="M104 784 C 110 724 98 690 118 648" stroke-width="3.5"/>
    <path d="M124 786 C 136 734 128 700 148 668" stroke-width="3"/>
  </g>
  <g class="grass grass-b" fill="none" stroke="#7C9858" stroke-linecap="round">
    <path d="M1088 786 C 1072 730 1090 690 1066 650" stroke-width="4"/>
    <path d="M1110 788 C 1122 734 1108 700 1130 662" stroke-width="3.4"/>
    <path d="M1134 790 C 1150 742 1142 708 1162 678" stroke-width="3"/>
  </g>
  <g class="grass" fill="none" stroke="#8AA85E" stroke-linecap="round">
    <path d="M980 792 C 968 750 984 722 966 694" stroke-width="3"/>
    <path d="M996 794 C 1008 752 998 726 1014 700" stroke-width="2.6"/>
  </g>
</svg>
